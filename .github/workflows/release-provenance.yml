name: Release

on:
  push:
    branches: [main]
    tags: ['0.0.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-provenance-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a new aligned version before merge
        env:
          T3_PREVIOUS_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/github_release.py validate

  prepare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reserve this push's version and start its tag build
        env:
          GH_TOKEN: ${{ github.token }}
          T3_PREVIOUS_SHA: ${{ github.event.before }}
        run: python3 scripts/github_release.py prepare

  attest:
    if: startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: public-plugin-release
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Require an immutable numeric alpha tag
        env:
          T3_SOURCE_REF: ${{ github.ref }}
        run: |
          [[ "$T3_SOURCE_REF" =~ ^refs/tags/0\.0\.(0|[1-9][0-9]*)$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Verify the tagged version
        env:
          T3_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(python3 scripts/github_release.py validate)" = "$T3_RELEASE_TAG"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Attest exact distributable bytes
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/main.js
            manifest.json
            styles.css
      - name: Publish the attested assets as a regular Alpha release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/github_release.py publish
